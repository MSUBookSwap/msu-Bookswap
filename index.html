// UI HELPER FUNCTIONS
function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').innerText = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2500);
}

function closeModal() {
    document.getElementById('modal-container').classList.add('hidden');
}

function updateCartBadge() {
    const badge = document.getElementById('cart-badge');
    if (badge) {
        if (state.cart.length > 0) {
            badge.innerText = state.cart.length;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }
}

function selectAuthRole(role) {
    selectedAuthRole = role;
    ['student', 'staff', 'guest'].forEach(type => {
        const btn = document.getElementById(`role-btn-${type}`);
        if(btn) {
            btn.className = "py-2 text-[11px] font-bold rounded-lg transition text-slate-500";
        }
    });

    if (role === 'นิสิต/นักศึกษา') {
        document.getElementById('role-btn-student').className = "py-2 text-[11px] font-bold rounded-lg transition shadow-sm bg-white text-msu-purple";
    } else if (role === 'อาจารย์/บุคลากร') {
        document.getElementById('role-btn-staff').className = "py-2 text-[11px] font-bold rounded-lg transition shadow-sm bg-white text-msu-purple";
    } else {
        document.getElementById('role-btn-guest').className = "py-2 text-[11px] font-bold rounded-lg transition shadow-sm bg-white text-msu-purple";
    }

    updateRoleFieldsUI();
}

function handleLogin(e) {
    e.preventDefault();
    const name = document.getElementById('login-name').value;
    const email = document.getElementById('login-email').value;
    const phone = document.getElementById('login-phone').value;
    const location = document.getElementById('login-location').value;
    const id = document.getElementById('login-id') ? document.getElementById('login-id').value : 'N/A';
    const faculty = document.getElementById('login-faculty') ? document.getElementById('login-faculty').value : 'ทั่วไป';
    const userIntent = document.getElementById('login-intent') ? document.getElementById('login-intent').value : 'buyer';

    state.userMode = userIntent;
    state.user = {
        name: name,
        role: selectedAuthRole,
        email: email,
        studentId: id,
        faculty: faculty,
        location: location,
        phone: phone,
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80"
    };

    showToast("เข้าสู่ระบบเรียบร้อยแล้ว!");
    document.getElementById('bottom-nav').classList.remove('hidden');
    switchTab('home');
}

// USER INTENT & ROLE SWITCHER
function setUserMode(mode) {
    state.userMode = mode;
    showToast(`สลับการใช้งานเป็น: ${mode === 'buyer' ? '🛒 โหมดผู้ซื้อ' : (mode === 'seller' ? '🏷️ โหมดผู้ขาย' : '🔄 ผู้ซื้อและผู้ขาย')}`);
    if (state.currentTab === 'home') renderHome();
    else if (state.currentTab === 'profile') renderProfile();
}

function updateSplitPreview(val) {
    const price = parseInt(val) || 0;
    const sellerShare = Math.round(price * 0.8);
    const platformShare = price - sellerShare;

    const sellerEl = document.getElementById('preview-seller-share');
    const platformEl = document.getElementById('preview-platform-share');

    if (sellerEl) sellerEl.innerText = `${sellerShare} Coin`;
    if (platformEl) platformEl.innerText = `${platformShare} Coin`;
}

function handleCreateListing(e) {
    e.preventDefault();
    const title = document.getElementById('new-title').value;
    const type = document.getElementById('new-type').value;
    const condition = document.getElementById('new-condition').value;
    const price = parseInt(document.getElementById('new-price').value);
    const deposit = parseInt(document.getElementById('new-deposit').value) || 0;
    const location = document.getElementById('new-location').value;
    const objectiveText = document.getElementById('new-objective').value;
    const contentsRaw = document.getElementById('new-contents').value;
    const highlightsRaw = document.getElementById('new-highlights').value;
    const desc = document.getElementById('new-desc').value;

    const contentsArr = contentsRaw ? contentsRaw.split(',').map(s => s.trim()) : ["ตำรา/หนังสือหลัก 1 เล่ม"];
    const highlightsArr = highlightsRaw ? highlightsRaw.split(',').map(s => s.trim()) : ["สภาพดี คุ้มค่า นัดรับสะดวกใน มมส"];

    const newItem = {
        id: state.listings.length + 1,
        title: title,
        category: type,
        type: type,
        condition: condition,
        price: price,
        deposit: deposit,
        seller: state.user.name,
        sellerRole: state.user.role,
        sellerId: state.user.studentId,
        faculty: state.user.faculty,
        location: location,
        rating: 5.0,
        reviews: 0,
        postDate: "เมื่อสักครู่",
        likes: 0,
        views: 1,
        image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80",
        description: desc || "รายการลงขายใหม่โดยสมาชิก MSU BookSwap",
        objective: objectiveText || "สำหรับใช้ทบทวนบทเรียนและเตรียมสอบวิชาที่เกี่ยวข้อง",
        contents: contentsArr,
        highlights: highlightsArr
    };

    state.listings.unshift(newItem);
    closeModal();
    showToast("ลงประกาศโพสต์ขายเรียบร้อยแล้ว!");
    switchTab('home');
}

// NAVIGATION TAB SWITCHER
function switchTab(tab) {
    state.currentTab = tab;
    ['home', 'search', 'quiz', 'cart', 'profile'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if(btn) {
            if (t === tab) {
                btn.classList.add('text-msu-purple');
                btn.classList.remove('text-slate-400');
            } else {
                btn.classList.remove('text-msu-purple');
                btn.classList.add('text-slate-400');
            }
        }
    });

    if (tab === 'home') renderHome();
    else if (tab === 'search') renderSearch();
    else if (tab === 'quiz') renderQuizScreen();
    else if (tab === 'cart') renderCart();
    else if (tab === 'profile') renderProfile();
}

function checkoutCart() {
    const totalCoins = state.cart.reduce((sum, item) => sum + item.price + (item.deposit || 0), 0);
    const chosenLoc = document.getElementById('checkout-location') ? document.getElementById('checkout-location').value : state.user.location;

    if (state.coins < totalCoins) {
        showToast("ยอด Coin ไม่พอ กรุณาเติม Coin ก่อนชำระ");
        openTopUpModal();
        return;
    }

    state.coins -= totalCoins;
    state.cart.forEach(item => {
        state.transactions.unshift({
            id: "TRX" + Math.floor(1000 + Math.random() * 9000),
            title: `ซื้อ: ${item.title} (นัดรับที่: ${chosenLoc})`,
            amount: "-" + (item.price + (item.deposit || 0)),
            type: "expense",
            date: "วันนี้"
        });
    });

    state.cart = [];
    updateCartBadge();
    showToast(`ชำระเงินสำเร็จ! นัดรับหนังสือได้ที่ ${chosenLoc}`);
    switchTab('profile');
}

</script>

<!-- Modal หน้าต่างฟอร์มสร้างเกมทบทวน -->
<div class="modal fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4" id="create-quiz-modal">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <h3 class="text-lg font-bold text-slate-800">🎮 สร้างเกมทบทวนบทเรียน</h3>
      <button type="button" class="text-slate-400 hover:text-slate-600 text-2xl font-bold" onclick="closeModal('create-quiz-modal')">&times;</button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อเกม / คำถามทบทวน:</label>
        <input type="text" id="quiz-title-input" placeholder="เช่น ควิซพื้นฐานการตลาด..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อวิชา / หมวดหมู่:</label>
        <input type="text" id="quiz-subject-input" placeholder="เช่น การตลาด 101..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="button" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all" onclick="saveNewQuiz()">บันทึกและสร้างเกม</button>
    </div>
  </div>
</div>

</script>
</body>
</html>
